name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify snapshots and docs
        run: python3 scripts/verify-docs.py
      - name: Run test suites
        run: node --test $(find shorts-filter card-handling -name '*.test.mjs' | sort)
